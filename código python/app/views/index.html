<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sabor & Clic</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>

<body>

    <header>
        <h1>Sabor & Clic</h1>
        <p>Gestão para Dark Kitchens e Espaços Gastronômicos</p>
    </header>

    <main>

        <section id="inicio">
            <h2>Bem-vindo ao Sabor & Clic!</h2>
            <p>
                Sistema para gerenciamento de pedidos e pratos
                de um espaço gastronômico.
            </p>
        </section>

        <section id="pratos">
            <h2>Pratos disponíveis</h2>

            <div id="lista-pratos">
                <!-- Os pratos serão inseridos pelo JavaScript -->
            </div>
        </section>

        <section id="pedido">
            <h2>Novo pedido</h2>

            <form id="form-pedido">

                <label for="cliente">Nome do cliente:</label>
                <input
                    type="text"
                    id="cliente"
                    name="cliente"
                    required
                >

                <button type="submit">
                    Criar pedido
                </button>

            </form>

            <p id="mensagem"></p>
        </section>

    </main>

    <footer>
        <p>Sabor & Clic - Projeto Integrador</p>
    </footer>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>

</html>
